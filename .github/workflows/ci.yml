name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Lint, types and bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Bundles the app for both native platforms: this is the cheapest CI-level
      # guarantee that the screens, routes and native modules actually build.
      - name: Export iOS and Android bundles
        run: npx expo export --platform ios --platform android --output-dir dist
